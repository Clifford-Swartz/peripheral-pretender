#
# Device profile for PIC32CM5164JH01100: facts that belong to this device
# rather than to an IP version (see generator/mchpgen/profile.py).
device: PIC32CM5164JH01100
references:
  - "DS60001632H 10.2.1 Table 10-3 (user row), Table 10-4 (OTP5), 10.3 (serial number)"
  - "DS80001000 Table 2 (DSU.DID revisions)"
# DSU.DID.REVISION per silicon revision (DS80001000 Table 2); default first
silicon_revisions: {B0: 1, C0: 2}
reset_overrides:
  DSU:
    DID: 0x11060100                 # PIC32CM5164JH01100 rev B0
  NVMCTRL:
    PARAM: 0x08032000               # NVMP 8192, PSZ 3 (64 B), DFP 128 pages
  PAC:
    STATUSC: 0x09000000             # SMBIST (bit 27) and unnamed bit 24
nvm_rows:
  # Production settings (BOOTPROT 0xB, BODVDD level 8 enabled with reset
  # action, BODCORE calibration 0x0A8, WDT off with PER/WINDOW/EWOFFSET 0xB,
  # region locks 0xFFFF). Not the DFP default 0xFFFFFFFF, which would boot
  # with an always-on WDT and BODVDD off.
  user_row: [0xB15088FB, 0xFFFFF8BB]
  serial_addrs: [0x0080A00C, 0x0080A040, 0x0080A044, 0x0080A048]
  serial_default: [0x50500000, 0x00000001, 0x00000002, 0x00000003]
  words:
    # Software calibration row (Table 10-4): ADC bias mid-scale (4), OSC32K
    # CAL 0x3F (OSC32K.CALIB reset), CAL48M 0x200220 (OSCCTRL.CAL48M reset).
    # Placeholders until dumped from silicon.
    - {addr: 0x00806020, value: 0x1103F924,
       what: "OTP5 word 0: ADC bias mid-scale, OSC32K CAL 0x3F, CAL48M low"}
    - {addr: 0x00806024, value: 0xFFFFFF00,
       what: "OTP5 word 1: CAL48M high, reserved"}
