#
# Device profile for ATSAME51J20A (on the Curiosity CircuitPython board,
# EV78P89A, of the Curiosity PyKit Explorer): facts that belong to this device
# rather than to an IP version (see generator/mchpgen/profile.py).
device: ATSAME51J20A
references:
  - "DS60001507 (SAM D5x/E5x data sheet): NVM user page (Table 9-1), serial number words
    (9.6), DSU.DID"
  - "ATDF ATSAME51J20A (SAME51_DFP 3.9.267): DSU.DID 0x61810304 (revision D)"
  - "The PyKit Explorer on the desk, 2026-10-14: boot_out.txt UID (CircuitPython 10.1)"
# DSU.DID.REVISION per silicon revision; default first
silicon_revisions: {D: 3, A: 0}
nvm_rows:
  # SAM D5x/E5x factory user page words 0/1 (DS60001507 Table 9-1 defaults:
  # BOD33 enabled, BOOTPROT 15 = none, WDT off). The Adafruit UF2
  # bootloader on the kit sets BOOTPROT to 16 KB; the twin loads CircuitPython
  # at 0x4000 without a bootloader, so the factory value is kept.
  user_row: [0xFE9A9239, 0xAEECFF80]
  # Serial number words (DS60001507 9.6)
  serial_addrs: [0x008061FC, 0x00806010, 0x00806014, 0x00806018]
  # The kit's own serial number: CircuitPython prints the bytes little
  # endian per word as UID F3E504005432505320202041213610FF.
  serial_default: [0x0004E5F3, 0x53503254, 0x41202020, 0xFF103621]
  # TEMP_LOG row (0x00800100): factory temperature points. Placeholders
  # (25.0 and 85.0 degrees C with typical PTAT/CTAT codes), not read from
  # silicon: CircuitPython's REPL cannot read the NVM rows. The ADC model
  # derives its PTAT/CTAT codes from these, so microcontroller.cpu.temperature
  # returns the twin's die temperature whatever the values.
  words:
    - {addr: 0x00800100, value: 0x00055019,
       what: "TEMP_LOG word 0: room 25.0 C, hot 85.0 C (placeholder)"}
    - {addr: 0x00800104, value: 0xCB2A5A00,
       what: "TEMP_LOG word 1: PTAT 2650 room, 3250 hot (placeholder)"}
    - {addr: 0x00800108, value: 0x009ECB90,
       what: "TEMP_LOG word 2: CTAT 2960 room, 2540 hot (placeholder)"}
reset_overrides:
  NVMCTRL:
    PARAM: 0x00060800               # NVMP 2048 pages, PSZ 6 (512 B); ATDF has NVMP 0
reset_from:
  # The SAM E51 keeps every WDT fuse in user page word 1 (ATDF FUSES)
  WDT:
    CTRLA.ENABLE: USER_FUSES.USER_WORD_1.WDT_ENABLE
    CTRLA.ALWAYSON: USER_FUSES.USER_WORD_1.WDT_ALWAYSON
    CTRLA.WEN: USER_FUSES.USER_WORD_1.WDT_WEN
    CONFIG.PER: USER_FUSES.USER_WORD_1.WDT_PER
    CONFIG.WINDOW: USER_FUSES.USER_WORD_1.WDT_WINDOW
    EWCTRL.EWOFFSET: USER_FUSES.USER_WORD_1.WDT_EWOFFSET
