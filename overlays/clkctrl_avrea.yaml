# Behavior overlay for the AVR Ex clock controller (CLKCTRL "avrea").
ip: CLKCTRL
id: avrea
versions: [""]
references:
  - "DS40002324 (AVR64EA48) chapter CLKCTRL, register descriptions"
registers:
  MCLKCTRLA: {hooks: [post_write]}         # CLKSEL: main clock source
  MCLKCTRLB: {hooks: [post_write]}         # PDIV/PEN: prescaler
  MCLKINTFLAGS: {w1c: [CFD]}
  MCLKSTATUS:
    # Oscillator status, from the model; MCC's init writes 0 to it, which
    # silicon ignores
    ro: [SOSC, OSCHFS, OSC32KS, XOSC32KS, EXTS]
    dynamic: true
  XOSC32KCTRLA: {hooks: [post_write]}
  XOSCHFCTRLA: {hooks: [post_write]}
